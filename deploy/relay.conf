# Релей для сервера, чей IP заблокирован у клиента.
#
# Задача: клиент не может открыть TCP до сервера (провайдер молча дропает пакеты),
# но сервер жив и доступен с других машин. Тогда трафик заворачивается через
# второй сервер обычным потоковым проксированием — без расшифровки.
#
# Ставится на сервер-релей (у нас — финский, fi.example.com):
#
#   apt-get install -y libnginx-mod-stream
#   mkdir -p /etc/nginx/stream.d
#   cp relay.conf /etc/nginx/stream.d/relay.conf     # путь и порт поправить
#   # в /etc/nginx/nginx.conf до блока http {}:
#   #   stream { include /etc/nginx/stream.d/*.conf; }
#   nginx -t && systemctl reload nginx
#
# В пуле такой сервер описывается как обычный, но:
#   host  = адрес релея (fi.example.com)
#   ports = [10000]           — порт релея
#   sni   = домен целевого сервера (se.example.com)
# Тогда TLS-рукопожатие идёт с настоящим сервером, релей видит только шифртекст.

server {
    listen 10000;
    proxy_pass 203.0.113.10:8443;   # целевой сервер:порт
    proxy_connect_timeout 10s;
    proxy_timeout 1h;                 # долгие сессии не рвутся
}
