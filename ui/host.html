<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>veil — защищённое соединение</title>
<style>
/* ============================================================================
   veil — design tokens
   Один файл, который меняет всё: цвет, типографику, ритм, движение.
   Тема одна — тёмная.
   ========================================================================== */

:root {
  /* ── палитра: графит + один акцент (индиго) + сигнальные ───────────────── */
  --accent: #5B8CFF;
  --accent-strong: #7AA3FF;
  --accent-ink: #08101F;
  --ok: #3BD98C;
  --ok-soft: rgba(59, 217, 140, 0.14);
  --warn: #F2B34B;
  --warn-soft: rgba(242, 179, 75, 0.14);
  --danger: #F26D6D;
  --danger-soft: rgba(242, 109, 109, 0.14);

  /* ── типографика: один шрифт, два веса ────────────────────────────────── */
  --font: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --w-regular: 450;
  --w-strong: 620;

  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-15: 15px;
  --fs-17: 17px;
  --fs-22: 22px;
  --fs-34: 34px;
  --fs-46: 46px;

  --lh-tight: 1.15;
  --lh-body: 1.5;
  --tracking-caps: 0.08em;

  /* ── ритм 4/8 ─────────────────────────────────────────────────────────── */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-7: 32px;
  --s-8: 40px;
  --s-9: 56px;

  /* ── формы ────────────────────────────────────────────────────────────── */
  --r-8: 8px;
  --r-12: 12px;
  --r-16: 16px;
  --r-22: 22px;
  --r-28: 28px;
  --r-pill: 999px;

  /* ── движение: 150–250 мс, ease-out ───────────────────────────────────── */
  --t-fast: 120ms;
  --t-base: 180ms;
  --t-slow: 260ms;
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}

/* ── тёмная тема (по умолчанию) ─────────────────────────────────────────── */
[data-theme="dark"] {
  --bg: #0A0C11;
  --bg-glow-1: rgba(91, 140, 255, 0.16);
  --bg-glow-2: rgba(122, 96, 255, 0.12);

  --layer-1: rgba(255, 255, 255, 0.035);
  --layer-2: rgba(255, 255, 255, 0.06);
  --layer-3: rgba(255, 255, 255, 0.09);
  --layer-hover: rgba(255, 255, 255, 0.05);

  --text: #EDF1F8;
  --text-2: #98A3B6;
  --text-3: #66707F;

  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.13);

  --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.05) inset,
                 0 24px 48px -32px rgba(0, 0, 0, 0.9);
  --shadow-hero: 0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                 0 30px 60px -30px rgba(91, 140, 255, 0.55);
  --scrim: rgba(6, 8, 12, 0.66);
}

/* ── светлая тема ───────────────────────────────────────────────────────── */


</style>
<style>
/* ============================================================================
   veil — app styles. Все значения — из tokens.css, хардкода цветов нет.
   ========================================================================== */

*,
*::before,
*::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-weight: var(--w-regular);
  font-size: var(--fs-15);
  line-height: var(--lh-body);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

/* фоновые свечения — глубина без «градиента на всём» */
.bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg::before,
.bg::after {
  content: "";
  position: absolute;
  width: 62vmax;
  height: 62vmax;
  border-radius: 50%;
  filter: blur(80px);
}
.bg::before { background: var(--bg-glow-1); top: -28vmax; left: -18vmax; }
.bg::after  { background: var(--bg-glow-2); bottom: -30vmax; right: -20vmax; }

/* ── оболочка ──────────────────────────────────────────────────────────── */
.shell {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: var(--s-4) var(--s-4) 0;
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  min-height: 44px;
}

.brand { display: flex; align-items: center; gap: var(--s-2); }
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: block;
  object-fit: contain;
  box-shadow: 0 6px 18px -8px rgba(91, 140, 255, 0.55);
}
.brand-name { font-weight: var(--w-strong); letter-spacing: -0.01em; }
.brand-sub {
  font-size: var(--fs-11);
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}

.top-actions { display: flex; align-items: center; gap: var(--s-2); }

/* ── карточки ──────────────────────────────────────────────────────────── */
.card {
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-22);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(18px) saturate(1.15);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  padding: var(--s-4);
}

.card.flat { padding: var(--s-3); border-radius: var(--r-16); }

.view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 2px var(--s-6);
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
  scroll-behavior: smooth;
}
.view::-webkit-scrollbar { width: 8px; }
.view::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--r-pill);
}
.view::-webkit-scrollbar-track { background: transparent; }

/* ── типографика ───────────────────────────────────────────────────────── */
.caps {
  font-size: var(--fs-11);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  color: var(--text-3);
  font-weight: var(--w-strong);
}
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
.title { font-size: var(--fs-17); font-weight: var(--w-strong); letter-spacing: -0.01em; }
.h1 { font-size: var(--fs-22); font-weight: var(--w-strong); letter-spacing: -0.02em; margin: 0; }

/* ── кнопки ────────────────────────────────────────────────────────────── */
.btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--layer-2);
  color: var(--text);
  font: inherit;
  font-weight: var(--w-strong);
  font-size: var(--fs-13);
  min-height: 44px;
  padding: 0 var(--s-4);
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease),
              background var(--t-base) var(--ease),
              border-color var(--t-base) var(--ease),
              opacity var(--t-base) var(--ease);
}
.btn:hover { background: var(--layer-3); }
.btn:active { transform: scale(0.985); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.btn.primary {
  background: linear-gradient(135deg, var(--accent), #7C60FF);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 14px 30px -16px rgba(91, 140, 255, 0.9);
}
.btn.primary:hover { filter: brightness(1.06); }

.btn.ghost { background: transparent; }
.btn.icon { width: 44px; padding: 0; }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }

.btn.hero {
  min-height: 60px;
  padding: 0 var(--s-7);
  font-size: var(--fs-15);
  border-radius: var(--r-pill);
}

/* фокус — всегда виден, но не «рамка везде» */
:focus-visible {
  outline: 2px solid var(--accent-strong);
  outline-offset: 3px;
  border-radius: var(--r-12);
}

/* ── статус ────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  height: 30px;
  padding: 0 var(--s-3);
  border-radius: var(--r-pill);
  font-size: var(--fs-12);
  font-weight: var(--w-strong);
  border: 1px solid var(--border);
  background: var(--layer-2);
  color: var(--text-2);
}
.badge .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-3);
}
.badge[data-state="connected"] { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft); }
.badge[data-state="connected"] .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.badge[data-state="connecting"] { color: var(--warn); border-color: var(--warn-soft); background: var(--warn-soft); }
.badge[data-state="connecting"] .dot { background: var(--warn); animation: pulse 1.1s var(--ease) infinite; }
.badge[data-state="error"] { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.badge[data-state="error"] .dot { background: var(--danger); }

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.6); opacity: 0.5; }
}

/* ── главный экран ─────────────────────────────────────────────────────── */
.home { display: grid; gap: var(--s-4); }

.hero {
  position: relative;
  display: grid;
  justify-items: center;
  gap: var(--s-3);
  padding: var(--s-4);
  border-radius: var(--r-28);
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(91, 140, 255, 0.14), transparent 60%),
    var(--layer-1);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.donut {
  position: relative;
  width: min(38vw, 168px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  isolation: isolate;
}
.donut > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.donut .ring-base { stroke: var(--border-strong); }

.donut .core {
  position: relative;
  width: 58%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  gap: 2px;
  color: var(--text);
  background:
    radial-gradient(80% 80% at 50% 20%, var(--layer-3), var(--layer-1));
  box-shadow: var(--shadow-hero);
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-slow) var(--ease);
}
.donut .core:active { transform: scale(0.97); }
.donut .core .glyph { width: 30px; height: 30px; opacity: 0.95; display: grid; place-items: center; }
.donut .core .glyph svg { width: 26px; height: 26px; position: static; }
.donut .core .label { font-size: var(--fs-11); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-2); }

.donut[data-state="connected"] .core {
  background: radial-gradient(80% 80% at 50% 20%, rgba(59, 217, 140, 0.22), var(--layer-1));
  box-shadow: 0 0 0 1px var(--ok-soft) inset, 0 0 60px -10px rgba(59, 217, 140, 0.55);
}
.donut[data-state="connected"] .ring-pulse { stroke: var(--ok); opacity: 0.55; animation: breathe 3.2s var(--ease) infinite; }
.donut[data-state="connecting"] .ring-pulse { stroke: var(--warn); opacity: 0.85; animation: spin 1.6s linear infinite; transform-origin: 50% 50%; }
.donut[data-state="error"] .ring-pulse { stroke: var(--danger); opacity: 0.7; }

@keyframes breathe { 0%,100% { opacity: 0.15; } 50% { opacity: 0.55; } }
@keyframes spin { to { transform: rotate(360deg); } }

.hero-status { display: grid; justify-items: center; gap: 2px; }
.hero-status .state { font-size: var(--fs-22); font-weight: var(--w-strong); letter-spacing: -0.02em; }
.hero-status .where { font-size: var(--fs-13); color: var(--text-2); }
.hero-status .where b { color: var(--text); font-weight: var(--w-strong); }

.hero-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; }

/* ── сетки и статы ─────────────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }

.stat { display: grid; gap: 2px; }
.stat .value { font-size: var(--fs-22); font-weight: var(--w-strong); letter-spacing: -0.02em; }
.stat .unit { font-size: var(--fs-12); color: var(--text-3); margin-left: 2px; }

.chart-wrap { padding: var(--s-3) var(--s-4) var(--s-2); }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s-2); }
.chart { width: 100%; height: 68px; display: block; overflow: visible; }
.chart .area { fill: url(#chartFill); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
.chart .dot { fill: var(--accent); }

/* ── быстрые переключатели ─────────────────────────────────────────────── */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.quick .item {
  display: grid; gap: var(--s-2);
  padding: var(--s-3);
  border-radius: var(--r-16);
  border: 1px solid var(--border);
  background: var(--layer-1);
  transition: border-color var(--t-base) var(--ease), background var(--t-base) var(--ease);
}
.quick .item.on { border-color: var(--accent); background: rgba(91, 140, 255, 0.08); }
.quick .item .name { font-size: var(--fs-12); color: var(--text-2); }
.quick .item .state { font-size: var(--fs-13); font-weight: var(--w-strong); }

/* ── переключатель ─────────────────────────────────────────────────────── */
.toggle {
  --w: 46px; --h: 28px;
  width: var(--w); height: var(--h);
  border-radius: var(--r-pill);
  border: 1px solid var(--border-strong);
  background: var(--layer-3);
  position: relative;
  cursor: pointer;
  padding: 0;
  transition: background var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
  flex: none;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: calc(var(--h) - 8px);
  height: calc(var(--h) - 8px);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  transition: transform var(--t-base) var(--ease);
}
.toggle[aria-checked="true"] { background: var(--accent); border-color: transparent; }
.toggle[aria-checked="true"]::after { transform: translateX(calc(var(--w) - var(--h))); }
.toggle[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }

/* ── строки списков ────────────────────────────────────────────────────── */
.list { display: grid; gap: var(--s-2); }

.row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3);
  border-radius: var(--r-16);
  border: 1px solid var(--border);
  background: var(--layer-1);
  min-height: 64px;
  transition: background var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
}
.row:hover { background: var(--layer-2); }
.row.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.row .main { display: grid; gap: 2px; min-width: 0; }
.row .name { font-weight: var(--w-strong); font-size: var(--fs-15); display: flex; align-items: center; gap: var(--s-2); }
.row .sub { font-size: var(--fs-12); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { display: flex; align-items: center; gap: var(--s-2); }

.flag {
  width: 34px; height: 34px;
  border-radius: 12px;
  display: grid; place-items: center;
  background: var(--layer-2);
  border: 1px solid var(--border);
  font-size: var(--fs-12);
  font-weight: var(--w-strong);
  letter-spacing: 0.02em;
  color: var(--text-2);
}

.ping { font-size: var(--fs-13); font-weight: var(--w-strong); }
.ping.good { color: var(--ok); }
.ping.mid { color: var(--warn); }
.ping.bad { color: var(--danger); }

/* загрузка сервера — тонкая полоска */
.loadpct {
  font-size: var(--fs-11);
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  min-width: 32px;
  text-align: right;
}
.load { width: 54px; height: 4px; border-radius: var(--r-pill); background: var(--layer-3); overflow: hidden; }
.load > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

.star {
  border: 0; background: transparent;
  width: 40px; height: 44px;
  display: grid; place-items: center;
  color: var(--text-3);
  cursor: pointer;
  border-radius: var(--r-12);
}
.star[aria-pressed="true"] { color: var(--warn); }

/* ── поиск и фильтры ───────────────────────────────────────────────────── */
.search {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 0 var(--s-3);
  height: 46px;
  border-radius: var(--r-16);
  border: 1px solid var(--border);
  background: var(--layer-1);
  color: var(--text-2);
}
.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-15);
}
.search input::placeholder { color: var(--text-3); }

.chips { display: flex; gap: var(--s-2); overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  height: 34px;
  padding: 0 var(--s-3);
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--layer-1);
  color: var(--text-2);
  font-size: var(--fs-12);
  font-weight: var(--w-strong);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--s-2);
  transition: all var(--t-base) var(--ease);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; }

/* ── подписка ──────────────────────────────────────────────────────────── */
.plan { display: grid; gap: var(--s-4); }
.plan-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); }
.plan-name { font-size: var(--fs-22); font-weight: var(--w-strong); letter-spacing: -0.02em; }
.bar { height: 8px; border-radius: var(--r-pill); background: var(--layer-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7C60FF); }

.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.kv .k { font-size: var(--fs-11); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-3); }
.kv .v { font-size: var(--fs-17); font-weight: var(--w-strong); }

/* ── настройки ─────────────────────────────────────────────────────────── */
.group { display: grid; gap: var(--s-2); }
.group-title { padding: 0 var(--s-1); }
.setting {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--border);
}
.setting:last-child { border-bottom: 0; }
.setting .label { display: grid; gap: 2px; }
.setting .label .sub { font-size: var(--fs-12); color: var(--text-3); }
select {
  appearance: none;
  height: 40px;
  padding: 0 34px 0 var(--s-3);
  max-width: 210px;
  text-overflow: ellipsis;
  border-radius: var(--r-12);
  border: 1px solid var(--border);
  background: var(--layer-2);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-13);
  cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2398A3B6' stroke-width='1.8' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
}

/* ── скелетоны ─────────────────────────────────────────────────────────── */
.skeleton {
  border-radius: var(--r-12);
  background: linear-gradient(90deg, var(--layer-2) 25%, var(--layer-3) 37%, var(--layer-2) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.6s var(--ease) infinite;
}
.skeleton.row-sk { height: 64px; border-radius: var(--r-16); }
.skeleton.line-sk { height: 14px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ── пустые состояния ──────────────────────────────────────────────────── */
.empty {
  display: grid; justify-items: center; gap: var(--s-3);
  padding: var(--s-8) var(--s-4);
  text-align: center;
}
.empty .art {
  width: 72px; height: 72px; border-radius: 40% 60% 55% 45% / 55% 45% 55% 45%;
  background: var(--layer-2);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  color: var(--text-3);
}
.empty .t { font-weight: var(--w-strong); font-size: var(--fs-17); }
.empty .d { color: var(--text-3); font-size: var(--fs-13); max-width: 34ch; }

/* ── шторка (sheet) ────────────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: var(--scrim);
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease);
}
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 41;
  width: min(560px, 100vw - 16px);
  transform: translate(-50%, 104%);
  transition: transform var(--t-slow) var(--ease);
  background: var(--layer-1);
  border: 1px solid var(--border-strong);
  border-bottom: 0;
  border-radius: var(--r-28) var(--r-28) 0 0;
  box-shadow: 0 -30px 80px -40px rgba(0, 0, 0, 0.9);
  padding: var(--s-4) var(--s-4) var(--s-6);
  display: grid; gap: var(--s-3);
}
.sheet-handle { width: 40px; height: 4px; border-radius: var(--r-pill); background: var(--border-strong); justify-self: center; }
body[data-overlay] .scrim { opacity: 1; pointer-events: auto; }
body[data-overlay] .sheet { transform: translate(-50%, 0); }

/* ── тосты ─────────────────────────────────────────────────────────────── */
.toasts {
  position: fixed; left: 50%; bottom: 88px; z-index: 60;
  transform: translateX(-50%);
  display: grid; gap: var(--s-2);
  width: min(420px, calc(100vw - 32px));
}
.toast {
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-16);
  background: var(--layer-3);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-card);
  font-size: var(--fs-13);
  animation: toast-in var(--t-slow) var(--ease);
}
.toast[data-kind="error"] { border-color: var(--danger-soft); color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ── табы ──────────────────────────────────────────────────────────────── */
.tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: var(--s-2) 0 calc(var(--s-3) + env(safe-area-inset-bottom));
  background: transparent;
  border: 0;
}
.tab {
  min-width: 0;
  min-height: 52px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font: inherit;
  font-size: var(--fs-11);
  font-weight: var(--w-strong);
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  border-radius: var(--r-12);
  cursor: pointer;
  transition: color var(--t-base) var(--ease), background var(--t-base) var(--ease);
}
.tab:hover { background: var(--layer-hover); }
.tab svg { width: 19px; height: 19px; opacity: 0.9; }
.tab[aria-selected="true"] { color: var(--text); background: transparent; }
.tab[aria-selected="true"] svg { color: var(--accent); }
.tab[aria-selected="true"] svg { color: var(--accent); }

/* ── десктоп ───────────────────────────────────────────────────────────── */
@media (min-width: 900px) {
  .shell { padding: var(--s-6) var(--s-6) 0; }
  .view { padding-bottom: var(--s-5); }
  .tabs {
    order: 1;
    border: 1px solid var(--border);
    border-radius: var(--r-16);
    margin-bottom: var(--s-2);
  }
  .shell > .view { order: 2; }
  .home { grid-template-columns: 1.06fr 1fr; align-items: start; }
  .side-col { display: grid; gap: var(--s-3); align-content: start; }
  .home .hero { grid-row: span 2; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

/* ── уважение к prefers-reduced-motion ─────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── плитки серверов на главной ─────────────────────────────────────────── */
.tiles-head { padding: var(--s-2) var(--s-1) 0; }
.tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-2);
}

.tile {
  position: relative;
  display: grid;
  gap: 2px;
  padding: var(--s-3);
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-16);
  transition: background var(--t-base) var(--ease), border-color var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.tile:hover { background: var(--layer-2); border-color: var(--border-strong); }
.tile:active { transform: scale(0.985); }
.tile[aria-pressed="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset, 0 8px 24px rgba(91, 140, 255, 0.14);
}
.tile-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.tile-name { font-weight: var(--w-strong); font-size: var(--fs-15); margin-top: var(--s-2); }
.tile-sub { font-size: var(--fs-12); color: var(--text-3); }
.tile-star {
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px;
  color: var(--text-3);
  opacity: 0;
  transition: opacity var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.tile:hover .tile-star, .tile-star[aria-pressed="true"] { opacity: 1; }
.tile-star[aria-pressed="true"] { color: var(--accent); }
.tile-live {
  display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  margin-right: 7px;
  vertical-align: middle;
  background: var(--ok);
  box-shadow: 0 0 0 4px var(--ok-soft);
  animation: pulse 2s var(--ease) infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--ok-soft); }
  50% { box-shadow: 0 0 0 7px transparent; }
}

/* ── строка состояния на главной ────────────────────────────────────────── */
.status-strip {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-22);
  box-shadow: var(--shadow-card);
}
.strip-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--text-3);
  flex: 0 0 auto;
}
.status-strip[data-state="connected"] { border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
.status-strip[data-state="connected"] .strip-dot {
  background: var(--ok);
  box-shadow: 0 0 0 4px var(--ok-soft);
  animation: pulse 2.4s var(--ease) infinite;
}
.status-strip[data-state="connecting"] .strip-dot { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
.status-strip[data-state="error"] .strip-dot { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
.strip-text { display: grid; gap: 2px; min-width: 0; flex: 1; }
.strip-title { font-size: var(--fs-15); font-weight: var(--w-strong); }
.strip-sub { font-size: var(--fs-12); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-btn { min-height: 36px; }

/* ── экран «Ключ» ───────────────────────────────────────────────────────── */
.add { display: grid; gap: var(--s-4); }
.add-head { display: grid; gap: var(--s-2); }
.add-head .title { font-size: var(--fs-22); font-weight: var(--w-strong); letter-spacing: -0.02em; }
.add-head .faint { font-size: var(--fs-13); color: var(--text-3); line-height: var(--lh-body); }

.paste-row {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-16);
  overflow: hidden;
  transition: border-color var(--t-base) var(--ease);
}
.paste-row:focus-within { border-color: var(--border-strong); }
.paste-row input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-13);
  padding: var(--s-4);
  outline: none;
}
.paste-row input::placeholder { color: var(--text-3); }
.paste-row .btn {
  border: 0;
  border-radius: 0;
  min-height: 52px;
  padding: 0 var(--s-5);
  border-left: 1px solid var(--border);
}

.paste-msg { min-height: 18px; font-size: var(--fs-12); color: var(--text-3); }
.paste-msg.is-ok { color: var(--ok); }
.paste-msg.is-error { color: var(--danger); }

.add-hint {
  display: grid;
  gap: var(--s-2);
  padding: var(--s-4);
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-16);
}
.add-hint .faint { font-size: var(--fs-12); color: var(--text-3); line-height: 1.6; }
.add-hint code { color: var(--text-2); font-size: var(--fs-12); }

/* ── экран «Свой сервер» ────────────────────────────────────────────────── */
.srv-form { display: grid; gap: var(--s-3); }
.srv-hint { font-size: var(--fs-13); line-height: 1.55; color: var(--text-3); }
.srv-grid { display: grid; gap: var(--s-3); }
.field { display: grid; gap: 6px; }
.field .caps { font-size: var(--fs-11); }
.field input {
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-12);
  padding: 10px var(--s-3);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-13);
  outline: none;
  transition: border-color var(--t-base) var(--ease);
}
.field input:focus { border-color: var(--border-strong); }
.field input:disabled { opacity: 0.55; }
.srv-note { font-size: var(--fs-11); color: var(--text-3); line-height: 1.5; }
.srv-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s-2); }
.srv-actions { display: flex; gap: var(--s-2); margin-top: var(--s-3); flex-wrap: wrap; }
.srv-actions input {
  flex: 1;
  min-width: 140px;
  background: var(--layer-1);
  border: 1px solid var(--border);
  border-radius: var(--r-12);
  padding: 10px var(--s-3);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-13);
  outline: none;
}
.srv-buttons { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.srv-buttons .btn { flex: 1; min-width: 150px; }

</style>

          if (snap.state !== "connected") return;
          snap.traffic.uptime += 1;
          snap.traffic.down = +(snap.traffic.down + 0.02 + Math.random() * 0.05).toFixed(2);
          snap.traffic.up = +(snap.traffic.up + 0.004 + Math.random() * 0.01).toFixed(2);
          snap.series = snap.series.slice(1).concat([26 + Math.round(18 * Math.sin(Date.now() / 4000) + Math.random() * 10)]);
          emit();
        }, 1000);
        emit();
      },
      async disconnect() {
        clearInterval(timer);
        snap.state = "disconnected"; snap.traffic.uptime = 0; emit();
      },
      selectServer(id) { snap.serverId = id; if (snap.state === "connected") { snap.state = "connecting"; emit(); setTimeout(() => { snap.state = "connected"; emit(); }, 900); } else emit(); },
      toggleFav(id) { const s = servers.find((x) => x.id === id); if (s) s.fav = !s.fav; emit(); },
      setSetting(key, value) { snap.settings[key] = value; emit(); },
      serverList() { return structuredClone(servers); },
      appAdd() { snap.apps.push({ name: "Новое приложение", path: "C:\\demo\\app.exe", on: true }); emit(); },
      appToggle(path) { const a = snap.apps.find((x) => x.path === path); if (a) a.on = !a.on; emit(); },
      appRun(name) { alert("В макете приложение «" + name + "» запускается через прокси"); },
      appDel(path) { snap.apps = snap.apps.filter((x) => x.path !== path); emit(); },
      srvInstall() { snap.srvStatus = "Макет: сервер не ставится"; emit(); },
      srvKeys() { snap.srvStatus = "Макет: ключи не читаются"; emit(); },
      srvIssue() { snap.srvStatus = "Макет: ключ не выдаётся"; emit(); },
      srvRevoke() { snap.srvStatus = "Макет: ключ не отзывается"; emit(); },
      srvConnect() { snap.srvStatus = "Макет: SSH недоступен"; emit(); },
      keyPaste() { snap.keyMsg = "Макет: ключ из буфера не читается"; emit(); },
      keyAdd() { snap.keyMsg = "Макет: ключ не добавляется"; emit(); },
      refresh() { emit(); },
    };
    return api;
  })();

  let adapter = mockAdapter;

  /* ── компоненты ──────────────────────────────────────────────────────── */
  const comp = {
    badge(s) {
      const map = {
        connected: ["connected", "Подключено"],
        connecting: ["connecting", "Подключение"],
        disconnected: ["disconnected", "Не подключено"],
        error: ["error", "Ошибка"],
        "no-internet": ["error", "Нет сети"],
      };
      const [st, text] = map[s] || map.disconnected;
      return `<span class="badge" data-state="${st}" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span>${text}</span>`;
    },

    toggle(on, action, label, disabled = false) {
      return `<button class="toggle" role="switch" aria-checked="${on}" aria-label="${esc(label)}"
        ${disabled ? 'aria-disabled="true" tabindex="-1"' : ""} data-action="${action}"></button>`;
    },

    ping(ms) {
      if (!ms) return `<span class="ping num faint">—</span>`;
      const cls = ms < 80 ? "good" : ms < 160 ? "mid" : "bad";
      return `<span class="ping num ${cls}">${ms} ms</span>`;
    },

    serverRow(s, selected) {
      return `
      <div class="row ${selected ? "selected" : ""}" data-server="${s.id}" role="button" tabindex="0"
           aria-label="${esc(s.country + ", " + s.city + ", " + s.ping + " мс")}">
        <span class="flag" aria-hidden="true">${s.cc}</span>
        <span class="main">
          <span class="name">${esc(s.country)} <span class="faint" style="font-weight:var(--w-regular)">· ${esc(s.city)}</span></span>
          <span class="sub">${s.load < 40 ? "Свободен" : s.load < 70 ? "Умеренная загрузка" : "Высокая загрузка"} · ${s.load}%</span>
        </span>
        <span class="side">
          <span class="loadpct" title="Загрузка сервера">${s.load}%</span>
          ${comp.ping(s.ping)}
          <button class="star" data-fav="${s.id}" aria-pressed="${s.fav}" aria-label="В избранное: ${esc(s.country)}">
            ${icon.star(s.fav)}
          </button>
        </span>
      </div>`;
    },

    tile(s, active, connected) {
      const load = s.load > 0 ? (s.load < 40 ? " · свободен" : s.load < 70 ? " · умеренно" : " · загружен") : "";
      return `
      <button class="tile" data-server="${s.id}" aria-pressed="${active}"
              aria-label="${esc(s.country + " · " + s.city + " · " + s.ping + " мс" + (active && connected ? " · подключено" : ""))}">
        <span class="tile-top">
          <span class="flag" aria-hidden="true">${s.cc}</span>
          ${comp.ping(s.ping)}
        </span>
        <span class="tile-name">${active && connected ? `<span class="tile-live" aria-hidden="true"></span>` : ""}${esc(s.country)}</span>
        <span class="tile-sub">${esc(s.city)}${load}</span>
        <span class="star tile-star" data-fav="${s.id}" role="button" aria-pressed="${s.fav}"
              aria-label="В избранное: ${esc(s.country)}">${icon.star(s.fav)}</span>
      </button>`;
    },

    sparkline(series) {
      const w = 320, h = 68;
      if (!series || series.length < 2) series = [0, 0];
      const max = Math.max(...series), min = Math.min(...series);
      const norm = (v) => h - ((v - min) / (max - min || 1)) * (h - 10) - 5;
      const pts = series.map((v, i) => [(i / (series.length - 1)) * w, norm(v)]);
      const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
      const area = `${line} L${w},${h} L0,${h} Z`;
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="График скорости">
        <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient></defs>
        <path class="area" d="${area}"/>
        <path class="line" d="${line}"/>
        <circle class="dot" cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3"/>
      </svg>`;
    },

    empty(title, desc, action = "") {
      return `<div class="empty">
        <div class="art">${icon.globe}</div>
        <div class="t">${esc(title)}</div>
        <div class="d">${esc(desc)}</div>
        ${action}
      </div>`;
    },

    skeletons(n = 4) {
      return `<div class="list">${Array.from({ length: n }, () => `<div class="skeleton row-sk"></div>`).join("")}</div>`;
    },

    fmtClock(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    },

    fmtGB(v) { return v.toFixed(2); },
  };

  /* ── экраны ──────────────────────────────────────────────────────────── */
  const views = {
    home(snap, servers) {
      const server = servers.find((x) => x.id === snap.serverId) || servers[0] || null;
      const s = snap.state;
      const connected = s === "connected";
      const connecting = s === "connecting";
      const err = s === "error";
      const noNet = s === "no-internet";

      const title = connected ? `Подключено${server ? " · " + esc(server.country) : ""}`
        : connecting ? "Подключаемся…"
        : err ? "Не подключено — ошибка"
        : noNet ? "Нет интернета"
        : "Не подключено";
      const sub = connected && server ? `${esc(server.city)} · ${server.ping} мс · ${comp.fmtClock(snap.traffic.uptime)}`
        : connecting ? "проверяем TLS и маршрут"
        : err ? esc(snap.error || "сервер не ответил, попробуй другой")
        : noNet ? "сначала верни сеть — туннель не поднять"
        : "нажми плитку сервера, чтобы подключиться";

      const tiles = servers.length
        ? servers.map((x) => comp.tile(x, x.id === snap.serverId, connected)).join("")
        : comp.empty("Нет ключей", "Добавь ключ veil:// в буфер и вставь его в приложении.",
            `<button class="btn primary" data-action="add-key">＋ Добавить ключ</button>`);

      return `
      <section class="home">
        <div class="status-strip" data-state="${err ? "error" : connecting ? "connecting" : connected ? "connected" : "idle"}">
          <span class="strip-dot" aria-hidden="true"></span>
          <span class="strip-text">
            <span class="strip-title">${title}</span>
            <span class="strip-sub">${sub}</span>
          </span>
          ${connected ? `<button class="btn ghost strip-btn" data-action="toggle">Отключить</button>` : ""}
        </div>
        <div class="tiles">${tiles}</div>
      </section>`;
    },

    add(snap) {
      const msg = snap.keyMsg || "";
      const err = /нет ключа|не распознан|не поддерживаются|уже добавлен/i.test(msg);
      return `
      <section class="add">
        <div class="add-head">
          <div class="title">Соединение</div>
          <div class="faint">Вставь ключ <b>veil://</b> — он появится на главной плиткой.</div>
        </div>

        <div class="paste-row">
          <input id="keyInput" type="text" placeholder="Вставить ключ" spellcheck="false"
                 aria-label="Ключ подключения" autocomplete="off">
          <button class="btn primary" data-action="key-paste">Вставить</button>
        </div>

        <div class="paste-msg ${err ? "is-error" : msg ? "is-ok" : ""}" role="status" aria-live="polite">${esc(msg)}</div>

        <div class="add-hint">
          <div class="caps">Как это работает</div>
          <div class="faint">
            Скопируй ключ (он начинается с <code>veil://</code>) и нажми «Вставить».
            Можно вставить ключ в поле вручную и нажать Enter — результат тот же.
            Ключи по IP-адресу не принимаются: нужен домен, иначе маскировка под TLS ломается.
          </div>
        </div>
      </section>`;
    },

    server(snap) {
      const keys = snap.srvKeys || [];
      const host = snap.srvHost || "";
      const busy = !!snap.srvBusy;
      const status = snap.srvStatus || "";

      const field = (id, label, ph, val, type) => `
        <label class="field">
          <span class="caps">${esc(label)}</span>
          <input id="${id}" type="${type || "text"}" placeholder="${esc(ph)}" value="${esc(val || "")}"
                 spellcheck="false" autocomplete="off" ${busy ? "disabled" : ""}>
        </label>`;

      const form = `
        <div class="card srv-form">
          <div class="srv-hint faint">
            Заполни доступ по SSH — приложение само поставит veil на сервер,
            выпустит сертификат и добавит ключ на главную.
          </div>
          <div class="srv-grid">
            ${field("srvHost", "Сервер", "203.0.113.10 или veil.example.com", host)}
            ${field("srvPort", "Порт SSH", "22", "22", "number")}
            ${field("srvUser", "Пользователь", "root", snap.srvUser || "root")}
            ${field("srvPass", "Пароль", "пароль root", "", "password")}
            ${field("srvDomain", "Домен (необязательно)", "veil.example.com — для Let's Encrypt", "")}
          </div>
          <div class="srv-buttons">
            <button class="btn primary" data-action="srv-install" ${busy ? "disabled" : ""}>
              ${busy ? "Устанавливаю…" : "Установить сервер"}
            </button>
            <button class="btn" data-action="srv-connect" ${busy ? "disabled" : ""}>Только подключиться</button>
          </div>
          <div class="srv-note faint">
            Без домена сервер получит самоподписанный сертификат, а клиент будет
            проверять его по отпечатку — шифрование то же, маскировка слабее.
          </div>
        </div>`;

      const keysBlock = host ? `
        <div class="card">
          <div class="srv-head">
            <span class="caps">Ключи на сервере</span>
            <span class="faint" style="font-size:var(--fs-12)">${esc(host)} · ${keys.length}</span>
          </div>
          ${keys.length
            ? `<div class="list">${keys.map((k) => `
                <div class="row" style="min-height:52px" data-key="${esc(k)}">
                  <span class="flag" aria-hidden="true">${esc(k.slice(0, 2).toUpperCase())}</span>
                  <span class="main"><span class="name">${esc(k)}</span><span class="sub">персональный ключ</span></span>
                  <span class="side"><button class="btn ghost" style="min-height:34px" data-action="srv-revoke" data-name="${esc(k)}">Отозвать</button></span>
                </div>`).join("")}</div>`
            : `<div class="faint" style="font-size:var(--fs-13)">пока один — тот, что выдан при установке</div>`}
          <div class="srv-actions">
            <input id="srvNewKey" type="text" placeholder="имя: мама, друг-петя" ${busy ? "disabled" : ""}>
            <button class="btn" data-action="srv-issue" ${busy ? "disabled" : ""}>Выдать ключ</button>
            <button class="btn ghost" data-action="srv-refresh" ${busy ? "disabled" : ""}>Обновить</button>
          </div>
        </div>` : "";

      return `
      <section class="add">
        <div class="add-head">
          <div class="title">Свой сервер</div>
          <div class="faint">Один раз ввести доступ по SSH — и сервер настраивается сам.</div>
        </div>
        ${form}
        ${keysBlock}
        <div class="paste-msg ${/Ошибка/i.test(status) ? "is-error" : status ? "is-ok" : ""}" role="status" aria-live="polite">${esc(status)}</div>
      </section>`;
    },

    settings(snap) {
      const s = snap.settings;
      const row = (title, sub, control) => `
        <div class="setting">
          <div class="label"><span>${esc(title)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</div>
          ${control}
        </div>`;
      const apps = snap.apps || [];

      return `
      <section style="display:grid;gap:var(--s-4)">
        <div class="group">
          <div class="caps group-title">Соединение</div>
          <div class="card" style="padding:0">
            ${row("Протокол", "veil · TLS 1.3, маскировка под браузер, fallback на реальный сайт", `<span class="faint num" style="font-size:var(--fs-13)">veil/1</span>`)}
            ${row("Kill switch", "блокировать трафик при обрыве", comp.toggle(s.killSwitch, "set-kill", "Kill switch"))}
            ${row("Автозапуск", "подключаться при старте системы", comp.toggle(s.autostart, "set-autostart", "Автозапуск"))}
            ${row("DNS", "как резолвить имена", `
              <select data-setting="dns" aria-label="DNS">
                ${["Через туннель", "Системный", "1.1.1.1", "9.9.9.9"].map((d) => `<option ${d === s.dns ? "selected" : ""}>${d}</option>`).join("")}
              </select>`)}
          </div>
        </div>

        <div class="group">
          <div class="caps group-title">Маршрутизация</div>
          <div class="card" style="padding:0">
            ${row("RU-сайты напрямую", "яндекс, госуслуги, банки — без туннеля", comp.toggle(s.split, "set-split", "RU-сайты напрямую"))}
            ${row("TUN-режим", s.tun === undefined ? "нужен перезапуск от администратора" : "весь трафик ОС, включая игры и UDP", comp.toggle(!!s.tun, "set-tun", "TUN-режим"))}
            <div class="setting">
              <div class="label"><span>Список исключений</span><span class="sub">.ru · .рф · 7410 российских подсетей</span></div>
              <button class="btn ghost" style="min-height:36px" data-action="sheet-rules">Изменить</button>
            </div>
          </div>
        </div>

        <div class="group">
          <div class="caps group-title">Приложения через туннель</div>
          <div class="card" style="padding:0">
            ${row("Выборочный режим", "только выбранные .exe, остальная система — мимо", `<button class="btn ghost" style="min-height:36px" data-action="app-add">Добавить</button>`)}
            ${apps.length
              ? apps.map((a) => `
                <div class="setting" data-app="${esc(a.path)}">
                  <div class="label"><span>${esc(a.name)}</span><span class="sub" title="${esc(a.path)}">${esc(a.path)}</span></div>
                  <span style="display:flex;align-items:center;gap:var(--s-2)">
                    <button class="btn ghost" style="min-height:36px" data-action="app-run" data-path="${esc(a.path)}" data-name="${esc(a.name)}">Запустить</button>
                    ${comp.toggle(a.on, "app-toggle", "Через туннель: " + a.name)}
                    <button class="star" data-app-del="${esc(a.path)}" aria-label="Удалить ${esc(a.name)}">×</button>
                  </span>
                </div>`).join("")
              : `<div class="setting"><div class="label"><span class="faint" style="font-size:var(--fs-13)">Список пуст — добавь .exe, чтобы запускать его через туннель</span></div></div>`}
          </div>
        </div>

        <div class="group">
          <div class="caps group-title">Данные</div>
          <div class="card" style="padding:0">
            ${row("Ключи", "ключи veil:// из буфера", `<button class="btn ghost" style="min-height:36px" data-action="add-key">Добавить</button>`)}
            ${row("Логи", "последние 200 строк", `<button class="btn ghost" style="min-height:36px" data-action="sheet-logs">Открыть</button>`)}
            ${row("Версия", "0.9.1 · Go 1.27.4", `<span class="faint num" style="font-size:var(--fs-13)">обновлено</span>`)}
          </div>
        </div>
      </section>`;
    },
  };

  /* ── рендер ──────────────────────────────────────────────────────────── */
  function render() {
    const snap = state.snapshot;
    if (!snap) return;
    const servers = adapter.serverList();

    document.documentElement.dataset.theme = "dark";
    const badgeHost = $("#topBadgeHost");
    if (badgeHost) badgeHost.innerHTML = comp.badge(snap.state);

    const view = $("#view");
    view.innerHTML = state.tab === "settings" ? views.settings(snap)
      : state.tab === "add" ? views.add(snap)
      : state.tab === "server" ? views.server(snap)
      : views.home(snap, servers);

    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
    if (state.tab === "home") decorateHero();
  }

  function decorateHero() {
    const ring = document.querySelector(".donut .ring-pulse");
    if (ring) ring.style.opacity = "";
  }

  /* ── действия ────────────────────────────────────────────────────────── */
  document.addEventListener("click", async (e) => {
    const tab = e.target.closest(".tab");
    if (tab) { state.tab = tab.dataset.tab; render(); return; }

    const appDel = e.target.closest("[data-app-del]");
    if (appDel) { e.stopPropagation(); adapter.appDel(appDel.dataset.appDel); return; }

    const appToggle = e.target.closest('[data-action="app-toggle"]');
    if (appToggle) {
      const box = appToggle.closest("[data-app]");
      adapter.appToggle(box ? box.dataset.app : "");
      return;
    }

    const fav = e.target.closest("[data-fav]");
    if (fav) { e.stopPropagation(); adapter.toggleFav(fav.dataset.fav); return; }

    // плитка сервера: другой — переключаемся, тот же и уже подключено — отключаем
    const tile = e.target.closest("[data-server]");
    if (tile && !e.target.closest("[data-fav]")) {
      const snap = state.snapshot;
      const id = tile.dataset.server;
      if (snap.state === "connecting") return;
      if (snap.state === "connected" && snap.serverId === id) { await adapter.disconnect(); return; }
      if (snap.serverId !== id) adapter.selectServer(id);
      if (state.snapshot.state !== "connected") await adapter.connect();
      return;
    }

    const action = e.target.closest("[data-action]");
    if (!action) return;
    const a = action.dataset.action;
    const snap = state.snapshot;

    if (a === "toggle") {
      if (snap.state === "connected") await adapter.disconnect();
      else if (snap.state !== "connecting") await adapter.connect();
    } else if (a === "set-kill") adapter.setSetting("killSwitch", !snap.settings.killSwitch);
    else if (a === "set-autostart") adapter.setSetting("autostart", !snap.settings.autostart);
    else if (a === "set-split") adapter.setSetting("split", !snap.settings.split);
    else if (a === "set-tun") adapter.setSetting("tun", !snap.settings.tun);
    else if (a === "add-key") { state.tab = "add"; render(); }
    else if (a === "key-paste") adapter.keyPaste();
    else if (a === "srv-install") {
      const root = action.closest("section");
      const val = (id) => { const el = root.querySelector("#" + id); return el ? el.value.trim() : ""; };
      adapter.srvInstall({ host: val("srvHost"), port: val("srvPort") || "22", user: val("srvUser") || "root",
                           pass: val("srvPass"), keyfile: "", domain: val("srvDomain") });
    }
    else if (a === "srv-connect") {
      const root = action.closest("section");
      const val = (id) => { const el = root.querySelector("#" + id); return el ? el.value.trim() : ""; };
      adapter.srvConnect({ host: val("srvHost"), port: val("srvPort") || "22", user: val("srvUser") || "root",
                           pass: val("srvPass"), keyfile: "" });
    }
    else if (a === "srv-issue") {
      const root = action.closest("section");
      const el = root.querySelector("#srvNewKey");
      const name = el ? el.value.trim() : "";
      if (name) adapter.srvIssue(name); else toast("Впиши имя, для кого ключ", "error");
    }
    else if (a === "srv-revoke") adapter.srvRevoke(action.dataset.name || "");
    else if (a === "srv-refresh") adapter.srvKeys();
    else if (a === "app-add") adapter.appAdd();
    else if (a === "app-run") adapter.appRun(action.dataset.path);
    else if (a === "sheet-rules") openSheet("Исключения маршрутизации", rulesSheet());
    else if (a === "sheet-logs") openSheet("Логи клиента", logsSheet());
    else if (a === "toast") toast(action.dataset.msg || "Готово", "ok");
    else if (a === "close-sheet") closeSheet();
  });

  document.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-setting]");
    if (!sel) return;
    const key = sel.dataset.setting;
    adapter.setSetting(key, sel.value);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" && e.target && e.target.id === "keyInput") {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v) adapter.keyAdd(v);
    }
    if (e.key === "Enter" || e.key === " ") {
      const row = e.target.closest("[data-server]");
      if (row) { e.preventDefault(); adapter.selectServer(row.dataset.server); }
    }
  });

  /* ── шторки и тосты ──────────────────────────────────────────────────── */
  function openSheet(title, html) {
    const scrim = $("#scrim"), sheet = $("#sheet");
    $("#sheetTitle").textContent = title;
    $("#sheetBody").innerHTML = html + `<button class="btn" style="width:100%;margin-top:var(--s-3)" data-action="close-sheet">Закрыть</button>`;
    scrim.hidden = false; sheet.hidden = false;
    requestAnimationFrame(() => { document.body.dataset.overlay = "1"; });
    sheet.querySelector("button, select, input")?.focus();
  }
  function closeSheet() {
    delete document.body.dataset.overlay;
    setTimeout(() => { $("#scrim").hidden = true; $("#sheet").hidden = true; }, 260);
  }
  $("#scrim").addEventListener("click", closeSheet);

  function rulesSheet() {
    return `<div class="list">
      ${[["Домены", ".ru, .рф, .su — 12 записей"], ["Сайты", "yandex.ru, gosuslugi.ru, sber.ru, ozon.ru"], ["Подсети", "10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12"]]
        .map(([k, v]) => `<div class="row" style="min-height:56px"><span class="main"><span class="name">${esc(k)}</span><span class="sub">${esc(v)}</span></span><span class="side"><button class="btn ghost" style="min-height:36px" data-action="toast" data-msg="Редактор списка откроется в следующей сборке">Изменить</button></span></div>`).join("")}
    </div>`;
  }

  function logsSheet() {
    const lines = [
      "18:15:02 tls handshake ok (fp=firefox, tls1.3)",
      "18:15:02 tunnel -> www.speedtest.net:443",
      "18:15:04 direct -> www.gosuslugi.ru:443",
      "18:15:07 tunnel -> api.ipify.org:443 (ES, 203.0.113.10)",
      "18:15:11 keepalive ok · 24 ms",
    ];
    return `<pre class="card" style="margin:0;font-family:ui-monospace,Consolas,monospace;font-size:var(--fs-12);color:var(--text-2);white-space:pre-wrap">${esc(lines.join("\n"))}</pre>`;
  }

  function toast(text, kind = "ok") {
    const host = $("#toasts");
    const el = document.createElement("div");
    el.className = "toast";
    el.dataset.kind = kind;
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }


  /* ── демо-состояния (?demo=1&state=error) ────────────────────────────── */
  function applyForcedState(snap) {
    if (!state.forced) return snap;
    const f = state.forced;
    if (f === "disconnected") snap.state = "disconnected";
    if (f === "connecting") snap.state = "connecting";
    if (f === "connected") snap.state = "connected";
    if (f === "error") { snap.state = "error"; snap.error = "Сервер отклонил TLS-рукопожатие"; }
    if (f === "no-internet") snap.state = "no-internet";
    if (f === "loading") state.loading = true;
    if (f === "empty") state.forcedEmpty = true;
    return snap;
  }

  /* ── запуск ──────────────────────────────────────────────────────────── */
  function setAdapter(a) {
    adapter = a;
    adapter.subscribe((snap) => {
      state.snapshot = applyForcedState(snap);
      render();
    });
  }

  window.VEIL_UI = { setAdapter, state, mock: mockAdapter };
  setAdapter(mockAdapter);

  // пустой список серверов для демонстрации состояния
  const emptyAdapter = {
    subscribe(fn) { mockAdapter.subscribe(fn); },
    connect: () => mockAdapter.connect(),
    disconnect: () => mockAdapter.disconnect(),
    selectServer: (id) => mockAdapter.selectServer(id),
    toggleFav: () => {},
    setSetting: (k, v) => mockAdapter.setSetting(k, v),
    serverList: () => (state.forced === "empty" ? [] : mockAdapter.serverList()),
    refresh: () => mockAdapter.refresh(),
  };
  if (new URLSearchParams(location.search).has("demo")) setAdapter(emptyAdapter);
})();

</script>
<script>
/* мост WebView2 → ядро: без него интерфейс остаётся на макете */
(() => {
  const wv = window.chrome && window.chrome.webview;
  if (!wv) return;
  let cb = null, servers = [];
  const post = (m) => wv.postMessage(m);
  wv.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.type !== "snapshot") return;
    if (m.servers) servers = m.servers;
    if (m.servers && window.VEIL_UI) window.VEIL_UI.__servers = servers;
    if (cb) cb(m.snapshot);
  });
  const host = {
    subscribe(fn) { cb = fn; post({ cmd: "ready" }); },
    serverList: () => servers,
    connect: () => post({ cmd: "connect" }),
    disconnect: () => post({ cmd: "disconnect" }),
    selectServer: (id) => post({ cmd: "select", id }),
    toggleFav: (id) => post({ cmd: "fav", id }),
    setSetting: (k, v) => post({ cmd: "setting", key: k, value: String(v) }),
    refresh: () => post({ cmd: "refresh" }),
    appAdd: () => post({ cmd: "app-add" }),
    appToggle: (path) => post({ cmd: "app-toggle", path }),
    appRun: (path) => post({ cmd: "app-run", path }),
    appDel: (path) => post({ cmd: "app-del", path }),
    keyPaste: () => post({ cmd: "key-paste" }),
    keyAdd: (key) => post({ cmd: "key-add", key }),
    srvInstall: (cfg) => post({ cmd: "srv-install", host: cfg.host, port: String(cfg.port), user: cfg.user,
                               pass: cfg.pass, keyfile: cfg.keyfile, domain: cfg.domain }),
    srvConnect: (cfg) => post({ cmd: "srv-connect", host: cfg.host, port: String(cfg.port), user: cfg.user,
                               pass: cfg.pass, keyfile: cfg.keyfile }),
    srvKeys: () => post({ cmd: "srv-keys" }),
    srvIssue: (name) => post({ cmd: "srv-issue", name }),
    srvRevoke: (name) => post({ cmd: "srv-revoke", name }),
  };
  if (window.VEIL_UI) window.VEIL_UI.setAdapter(host);
})();
</script>
