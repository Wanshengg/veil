<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>veil — защищённое соединение</title>
<link rel="stylesheet" href="tokens.css?v=3">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">v</div>
      <div>
        <div class="brand-name">veil</div>
        <div class="brand-sub">tls tunnel</div>
      </div>
    </div>
    <div class="top-actions">
      <span id="topBadgeHost" role="status" aria-live="polite"><span class="badge" data-state="disconnected">
        <span class="dot" aria-hidden="true"></span>Отключено
      </span></span>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 4v5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V7l7-4z"/></svg>
      Главная
    </button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2l.4 2.7h4.4l.4-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      Настройки
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 class="title" id="sheetTitle">—</h2>
  <div id="sheetBody"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js?v=4"></script>
<script>
/* мост WebView2 → ядро: без него интерфейс остаётся на макете */
(() => {
  const wv = window.chrome && window.chrome.webview;
  if (!wv) return;
  let cb = null, servers = [];
  const post = (m) => wv.postMessage(m);
  wv.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.type !== "snapshot") return;
    if (m.servers) servers = m.servers;
    if (m.servers && window.VEIL_UI) window.VEIL_UI.__servers = servers;
    if (cb) cb(m.snapshot);
  });
  const host = {
    subscribe(fn) { cb = fn; post({ cmd: "ready" }); },
    serverList: () => servers,
    connect: () => post({ cmd: "connect" }),
    disconnect: () => post({ cmd: "disconnect" }),
    selectServer: (id) => post({ cmd: "select", id }),
    toggleFav: (id) => post({ cmd: "fav", id }),
    setSetting: (k, v) => post({ cmd: "setting", key: k, value: String(v) }),
    refresh: () => post({ cmd: "refresh" }),
    appAdd: () => post({ cmd: "app-add" }),
    appToggle: (path) => post({ cmd: "app-toggle", path }),
    appRun: (path) => post({ cmd: "app-run", path }),
    appDel: (path) => post({ cmd: "app-del", path }),
  };
  if (window.VEIL_UI) window.VEIL_UI.setAdapter(host);
})();
</script>

</body>
</html>
