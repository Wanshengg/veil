<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>veil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* тема применяется до первой отрисовки — вспышки светлого фона нет */
(() => {
  try {
    const saved = localStorage.getItem("veil.theme") || "system";
    const dark = saved === "dark" || (saved === "system" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
  const ready = () => document.documentElement.classList.add("ready");
  requestAnimationFrame(() => requestAnimationFrame(ready));
  setTimeout(ready, 100);          // запас, если кадры не успевают
})();
</script>
<link rel="stylesheet" href="tokens.css?v=6">
<link rel="stylesheet" href="app.css?v=6">
</head>
<body>
<main id="view" tabindex="-1"></main>
<div id="overlay"></div>
<script src="app.js?v=6"></script>
<script>
/* мост к ядру: без него интерфейс остаётся на макете */
(() => {
  const wv = window.chrome && window.chrome.webview;
  if (!wv) return;
  let cb = null, servers = [];
  const post = (m) => wv.postMessage(m);
  wv.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.type !== "snapshot") return;
    if (m.servers) servers = m.servers;
    if (cb) cb(m.snapshot);
  });
  const host = {
    subscribe(fn) { cb = fn; post({ cmd: "ready" }); },
    serverList: () => servers,
    connect: () => post({ cmd: "connect" }),
    disconnect: () => post({ cmd: "disconnect" }),
    selectServer: (id) => post({ cmd: "select", id }),
    toggleFav: () => {},
    setSetting: (k, v) => post({ cmd: "setting", key: k, value: String(v) }),
    onboard: () => post({ cmd: "onboard" }),
    refresh: () => post({ cmd: "refresh" }),
    keyPaste: () => post({ cmd: "key-paste" }),
    keyAdd: (key) => post({ cmd: "key-add", key }),
    srvInstall: (cfg) => post({ cmd: "srv-install", host: cfg.host, port: String(cfg.port), user: cfg.user,
                                pass: cfg.pass, keyfile: cfg.keyfile, domain: cfg.domain }),
    srvConnect: (cfg) => post({ cmd: "srv-connect", host: cfg.host, port: String(cfg.port), user: cfg.user,
                                pass: cfg.pass, keyfile: cfg.keyfile }),
    srvKeys: () => post({ cmd: "srv-keys" }),
    srvIssue: (name) => post({ cmd: "srv-issue", name }),
    srvRevoke: (name) => post({ cmd: "srv-revoke", name }),
  };
  if (window.VEIL_UI) window.VEIL_UI.setAdapter(host);
})();
</script>
</body>
</html>
